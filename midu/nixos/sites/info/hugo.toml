# Configuración de info.<dominio>: la base de conocimientos publicada con Hugo + Hextra.
# baseURL se sobreescribe en tiempo de construcción con el dominio real (--baseURL),
# porque el dominio vive en config.nix (fuera de git).
baseURL      = "https://info.alfabeto.digital/"
languageCode = "es"
title        = "alfabeto.digital: base de conocimientos"
theme        = "hextra"

# No publicar como páginas: fuentes de Obsidian/Python, cache de graphify y notas de
# desarrollo. Las imágenes (.png) no se tocan aquí; se sirven como estáticos.
ignoreFiles = [
  "\\.obsidian",
  "graphify/",                       # artefactos de graphify (graph.html, reportes, cache); no son páginas
  "objetos_digitales/excalidraw",    # scripts internos del plugin Excalidraw (Slideshow.md, etc.)
  "notas_de_desarrollo\\.md$",
  "-slideshow\\.py$",
  "\\.excalidraw\\.md$",
]

[params]
  # Base del navegador de código: los enlaces que escapan de la bóveda (a .nix,
  # TREE.md, archivos de despliegue, etc.) se reescriben contra esta URL.
  repoBrowser = "https://github.com/alfabeto-digital/conspiratorios_populares_de_las_soberanias/blob/main"

  # Hextra baja Mermaid y FlexSearch de un CDN en tiempo de construcción, lo que
  # falla en el sandbox de Nix. Vendorizamos esas librerías (inputs del flake,
  # copiadas a assets/js) y le decimos a Hextra que las cargue localmente.
  [params.mermaid]
    js = "js/mermaid.min.js"
  [params.search]
    enable = true
    [params.search.flexsearch]
      js = "js/flexsearch.bundle.min.js"

[markup]
  [markup.goldmark.renderer]
    # Permite el HTML embebido de las notas (p. ej. <br> en tablas).
    unsafe = true
  [markup.highlight]
    noClasses = false

# Hextra: diagramas Mermaid (los bloques ```mermaid de replicación.md, etc.).
[params.navbar]
  displayTitle = true

# Modo de color: inicia según el sistema y muestra el interruptor claro/oscuro.
# La paleta gruvbox (claro y oscuro) vive en assets/css/custom.css.
[params.theme]
  default       = "system"
  displayToggle = true

# Botón de copiar en los bloques de código (Hextra lo trae activado por defecto; lo dejamos
# explícito). "always" lo deja siempre visible (no solo al pasar el cursor).
[params.highlight.copy]
  enable  = true
  display = "always"

# Tipografía (Nerd Fonts). Hextra no expone variables de fuente, así que las
# definimos en assets/css/custom.css (@font-face) y las servimos desde /fonts
# (ver modules/nixos/network/hugo.nix, que copia assets/fonts a static/fonts):
#   cuerpo      ShureTechMono Nerd Font
#   monoespacio ProFont IIx Nerd Font
#   interfaz    GohuFont 14 Nerd Font
#   H1          DepartureMono Nerd Font
#   H2..H6      DaddyTimeMono Nerd Font
#
# Accesibilidad: un botón "lectura accesible" debajo del selector de tema, en el pie fijo
# de la barra lateral (inyectado por layouts/_partials/custom/footer.html), alterna la clase
# .opendyslexic en <html> y la persiste; head-end.html la restaura sin parpadeo. En ese
# modo el cuerpo pasa a OpenDyslexic.

# Menú principal (navbar). Hextra no trae menú por defecto: cada elemento (incluida la
# búsqueda) es una entrada [[menu.main]]. Sin la entrada type="search" no aparece el botón
# de búsqueda aunque params.search.enable sea true. El selector de tema vive en el pie de la
# barra lateral, así que aquí no lo repetimos.
[[menu.main]]
  name   = "alfabeto.digital"
  url    = "https://alfabeto.digital"
  weight = 1
[[menu.main]]
  weight = 2
  [menu.main.params]
    type = "search"
